batch_name: forecast_for_objects

locations:
  - id: spb-office
    name: Санкт-Петербург, объект 1
    latitude: 59.9386
    longitude: 30.3141
    elevation_m: 12
    timezone: Europe/Moscow

  - id: pskov-field-7
    name: Псковская область, поле 7
    latitude: 57.8136
    longitude: 28.3496
    elevation_m: 48
    timezone: Europe/Moscow

sources:
  - source_id: open_meteo_gfs
    forecast_days: 10

