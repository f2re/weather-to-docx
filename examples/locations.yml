batch_name: forecast_for_objects

locations:
  - id: spb-office
    name: Санкт-Петербург, объект 1
    latitude: 59.9386
    longitude: 30.3141
    elevation_m: 12
    timezone: Europe/Moscow
    group: Основные объекты

  - id: pskov-field-7
    name: Псковская область, поле 7
    latitude: 57.8136
    longitude: 28.3496
    elevation_m: 48
    timezone: Europe/Moscow
    group: Сельскохозяйственные поля

sources:
  # Детерминированные глобальные модели. Каждая попадёт в отдельную секцию DOCX.
  - source_id: open_meteo_gfs
    forecast_days: 10

  - source_id: open_meteo_ecmwf_ifs
    forecast_days: 10

  - source_id: open_meteo_ecmwf_aifs
    forecast_days: 10

  - source_id: open_meteo_dwd_icon_global
    forecast_days: 8

  - source_id: open_meteo_gem_gdps
    forecast_days: 10

  # Ансамбль повышенного разрешения. PoP считается по членам, а не берётся
  # из детерминированной суммы осадков.
  - source_id: open_meteo_gefs_0p25
    forecast_days: 10
    options:
      precipitation_threshold_mm: 0.1

  # Дальняя тенденция GEFS до 35 суток. Для оперативного документа обычно
  # достаточно 16 суток; увеличение задаётся явно.
  - source_id: open_meteo_gefs_0p5
    forecast_days: 16
    options:
      precipitation_threshold_mm: 0.1

  # Для прямого NOAA GFS установите ecCodes и снимите комментарии.
  # - source_id: noaa_gfs_0p25
  #   forecast_days: 7
  #   options:
  #     hourly_to_120: true
  #     max_concurrency: 4
  #     box_degrees: 0.5

document:
  title: Метеорологический прогноз по объекту
  page_size: A3
  summary_interval_hours: 3
  extended_summary_interval_hours: 6
  summary_switch_hour: 120
  include_detailed_table: true
  include_all_parameters: true
  parameter_profile: all
  organisation: Пример организации
  prepared_by: Дежурный инженер-метеоролог
