[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "weather-to-docx"
version = "0.1.0"
description = "Формирование профессиональных DOCX-прогнозов погоды по координатам"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "f2re" }]
dependencies = [
  "cryptography>=42,<48",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
grib = [
  "eccodes>=2.37,<3",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
weather-to-docx = "weather_to_docx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_to_docx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
