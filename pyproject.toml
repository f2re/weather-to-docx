[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "weather-to-docx"
version = "0.5.1"
description = "Профессиональные оперативные прогнозы, риски и метеограммы в DOCX"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "f2re" }]
dependencies = [
  "cryptography>=42,<48",
  "eccodes>=2.37,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-docx>=1.1,<2",
  "python-telegram-bot>=22.8,<23",
  "PyYAML>=6,<7",
  "timezonefinder>=8.2,<9",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
weather-to-docx = "weather_to_docx.cli:app"
weather-to-docx-api = "weather_to_docx.api_entrypoint:main"
weather-to-docx-telegram = "weather_to_docx.telegram_entrypoint:main"
weather-to-docx-verify = "weather_to_docx.runtime_check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_to_docx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/weather_to_docx/document/generator.py" = ["F401"]
"src/weather_to_docx/document/audit_generator.py" = ["I001"]
"src/weather_to_docx/plotting/professional_meteogram.py" = ["F401"]
"tests/test_audit_consensus.py" = ["I001"]
"tests/test_audit_document.py" = ["I001"]
"tests/test_professional_meteogram.py" = ["I001"]
