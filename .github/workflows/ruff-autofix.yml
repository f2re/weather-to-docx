name: Одноразовое исправление Ruff

on:
  push:
    branches: ["agent/initial-mvp"]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Получить ветку
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить Ruff
        run: python -m pip install 'ruff==0.16.1'

      - name: Исправить код
        run: ruff check . --fix --unsafe-fixes

      - name: Опубликовать исправления
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Исправления не требуются"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправлены замечания статической проверки"
          git push origin "HEAD:${GITHUB_REF_NAME}"
