name: Проверка

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить системные утилиты
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd

      - name: Установить проект
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Статическая проверка
        run: ruff check .

      - name: Тесты
        run: pytest

      - name: Проверка компиляции
        run: python -m compileall -q src

      - name: Сформировать автономный пример
        run: weather-to-docx sample --output var/ci-sample --hours 24

      - name: Сохранить DOCX-пример
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: sample-docx
          path: var/ci-sample/**/*.docx
          if-no-files-found: error
