name: Проверка

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить системные утилиты
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd

      - name: Установить проект
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Статическая проверка Python
        run: ruff check .

      - name: Проверка JavaScript и сценариев установки
        run: |
          node --check src/weather_to_docx/static/app.js
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Тесты
        run: pytest

      - name: Проверка компиляции
        run: python -m compileall -q src

      - name: Сборка wheel и проверка локального интерфейса
        run: |
          rm -rf dist/wheels
          python -m pip wheel --no-deps . --wheel-dir dist/wheels
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist/wheels").glob("weather_to_docx-*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              entry_points_name = next(
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              )
              entry_points = archive.read(entry_points_name).decode("utf-8")
          required = {
              "weather_to_docx/static/index.html",
              "weather_to_docx/static/styles.css",
              "weather_to_docx/static/app.js",
              "weather_to_docx/ensemble/science.py",
              "weather_to_docx/document/scientific_generator.py",
              "weather_to_docx/geocoding/dadata.py",
              "weather_to_docx/telegram_bot.py",
              "weather_to_docx/api_entrypoint.py",
              "weather_to_docx/telegram_entrypoint.py",
          }
          missing = required - names
          assert not missing, f"Файлы не вошли в wheel: {sorted(missing)}"
          for command in (
              "weather-to-docx",
              "weather-to-docx-api",
              "weather-to-docx-telegram",
          ):
              assert command in entry_points, entry_points
          PY

      - name: Сформировать автономный пример
        run: weather-to-docx sample --output var/ci-sample --hours 24

      - name: Собрать автономный комплект без GRIB-дополнения
        if: matrix.python-version == '3.11'
        env:
          INCLUDE_GRIB: "0"
          OUTPUT_DIR: dist/offline
        run: |
          bash scripts/build-offline-bundle.sh
          archive=$(find dist/offline -maxdepth 1 -name 'weather-to-docx-offline-*.tar.zst' -print -quit)
          test -n "$archive"
          sha256sum -c "$archive.sha256"
          tar --zstd -tf "$archive" > dist/offline/contents.txt
          grep -q '/setup.sh$' dist/offline/contents.txt
          grep -q '/configure.sh$' dist/offline/contents.txt
          grep -q '/systemd/weather-to-docx-telegram.service$' dist/offline/contents.txt
          grep -q '/docs/ENSEMBLES.md$' dist/offline/contents.txt
          grep -q '/docs/TELEGRAM.md$' dist/offline/contents.txt
          grep -q '/docs/DADATA.md$' dist/offline/contents.txt

      - name: Сохранить DOCX-пример
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: sample-docx
          path: var/ci-sample/**/*.docx
          if-no-files-found: error
